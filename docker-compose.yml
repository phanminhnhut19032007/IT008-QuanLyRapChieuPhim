services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cinemadb_sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=CinemaDB@2026Password
    volumes:
      - sqlserver_data:/var/opt/mssql/data

volumes:
  sqlserver_data: