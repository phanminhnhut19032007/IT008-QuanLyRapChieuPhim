services:
  sqlserver-data-permissions:
    image: busybox:1.36
    user: "0:0"
    command: sh -c "chown -R 10001:0 /var/opt/mssql/data && chmod -R g=u /var/opt/mssql/data"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
    restart: "no"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cinemadb_sqlserver
    depends_on:
      sqlserver-data-permissions:
        condition: service_completed_successfully
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=CinemaDB@2026Password
    volumes:
      - sqlserver_data:/var/opt/mssql/data

volumes:
  sqlserver_data:
